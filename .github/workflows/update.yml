name: Update Hungarian IPTV

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate playlist
        run: python3 filter.py

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add magyar.m3u
          git diff --cached --quiet || git commit -m "Auto-update Hungarian IPTV playlist"
          git push
